name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(poetry version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject version $version -- bump the version and retag"
            exit 1
          fi
          echo "tag and pyproject agree on $version"

      - name: Build
        run: poetry build

      - name: Show what will be published
        run: ls -l dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Trusted publishing: PyPI verifies this workflow's identity, so there is
    # no API token to store or rotate.
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
